syntax = "proto3";

package rtlproto.v1;

option go_package = "github.com/dim13/rtl_proto/rtlprotov1";

// Receiver streams I/Q samples from one RTL-SDR and controls it.
service Receiver {
  // Device identity and capabilities.
  rpc Info(InfoRequest) returns (DeviceInfo);
  // Apply the fields that are set; return the effective state.
  rpc Configure(Settings) returns (Settings);
  // Sample stream. At most one active stream per remote; a new stream
  // takes over and the old one ends with ABORTED.
  rpc Stream(StreamRequest) returns (stream Frame);
  // Power spectrum of the whole tuned band.
  rpc Spectrum(SpectrumRequest) returns (stream SpectrumLine);
  // Narrowband I/Q around an offset from the center frequency. The
  // client sends the initial request and then any changes (e.g. a new
  // offset) on the same stream; the remote applies them without a gap.
  rpc Channel(stream ChannelRequest) returns (stream ChannelFrame);
}

message InfoRequest {}

message DeviceInfo {
  // Detected tuner chip.
  optional TunerType tuner = 1;
  // Board is an RTL-SDR Blog V4 (HF through upconverter).
  optional bool blog_v4 = 2;
  // Gain table in tenths of dB, ascending.
  repeated int32 gains_tenth_db = 3;
  // USB manufacturer string.
  optional string manufacturer = 4;
  // USB product string.
  optional string product = 5;
  // Current device state.
  Settings current = 6;
}

// Values match librtlsdr and the rtl_tcp greeting.
enum TunerType {
  TUNER_TYPE_UNKNOWN = 0;
  TUNER_TYPE_E4000 = 1;
  TUNER_TYPE_FC0012 = 2;
  TUNER_TYPE_FC0013 = 3;
  TUNER_TYPE_FC2580 = 4;
  TUNER_TYPE_R820T = 5;
  TUNER_TYPE_R828D = 6;
}

// Unset fields are left unchanged.
message Settings {
  // Center frequency in Hz.
  optional uint64 frequency_hz = 1;
  // Sample rate in Hz, as requested.
  optional uint32 sample_rate_hz = 2;
  // Sample rate actually achieved, in Hz. Reply only.
  optional double sample_rate_exact_hz = 3;
  // Crystal correction in ppm.
  optional sint32 ppm = 4;
  // Manual tuner gain instead of tuner AGC.
  optional bool gain_manual = 5;
  // Tuner gain in tenths of dB, one of DeviceInfo.gains_tenth_db.
  // Implies manual gain.
  optional sint32 gain_tenth_db = 6;
  // Demodulator digital AGC.
  optional bool agc = 7;
  // DC power on the antenna input.
  optional bool bias_tee = 8;
  // Direct sampling mode.
  optional DirectSampling direct_sampling = 9;
}

enum DirectSampling {
  DIRECT_SAMPLING_OFF = 0;
  DIRECT_SAMPLING_I = 1;
  DIRECT_SAMPLING_Q = 2;
}

message StreamRequest {
  // Lowest bits per component the remote may use, 1..8; 0 means 2.
  optional uint32 min_bits = 1;
  // Highest bits per component, 1..8; 0 means 8.
  optional uint32 max_bits = 2;
}

message Frame {
  // Index of the first complex sample since the stream started.
  optional uint64 first_sample = 1;
  // Complex samples in this frame.
  optional uint32 count = 2;
  // Bits per component, 1..8. At 8, data is raw u8 I/Q.
  optional uint32 bits = 3;
  // Quantizer step in u8 units, for bits < 8.
  optional float step = 4;
  // Incremented by every Configure that changed tuning.
  optional uint64 settings_gen = 5;
  // Packed codes, I and Q interleaved, MSB first.
  optional bytes data = 6;
  // When the remote read the frame from USB.
  optional int64 captured_unix_nano = 7;
}

message SpectrumRequest {
  // FFT size, power of two 64..65536; 0 means 2048.
  optional uint32 bins = 1;
  // Lines per second, 1..60; 0 means 25.
  optional uint32 lines_per_second = 2;
}

message SpectrumLine {
  // Tuned frequency for this line.
  optional uint64 center_hz = 1;
  // Span of the line.
  optional uint32 sample_rate_hz = 2;
  // As Frame.settings_gen.
  optional uint64 settings_gen = 3;
  // When the remote read the last frame of this line from USB.
  optional int64 captured_unix_nano = 4;
  // One byte per bin, lowest frequency first (DC in the middle). Value v
  // means (v / 2) - 127.5 dBFS: 0.5 dB steps over -127.5..0.
  optional bytes power = 5;
}

message ChannelRequest {
  // Offset from the center frequency, within ±rate/2.
  optional sint64 offset_hz = 1;
  // Output rate; the device rate must be an integer multiple of it.
  optional uint32 sample_rate_hz = 2;
  // Filter passband (two-sided); 0 means 0.8 × rate.
  optional uint32 bandwidth_hz = 3;
}

message ChannelFrame {
  // Index of the first output sample since the stream started.
  optional uint64 first_sample = 1;
  // Complex samples in this frame.
  optional uint32 count = 2;
  // Output rate.
  optional uint32 sample_rate_hz = 3;
  // Offset in effect for these samples.
  optional sint64 offset_hz = 4;
  // As Frame.settings_gen.
  optional uint64 settings_gen = 5;
  // When the remote read the last input frame from USB.
  optional int64 captured_unix_nano = 6;
  // int16 little-endian, I and Q interleaved; 32767 equals the full
  // scale of the u8 input (±127.5).
  optional bytes iq = 7;
}
