syntax = "proto3";

package rtlproto.v1;

option go_package = "github.com/dim13/rtl_proto/rtlprotov1";

// Receiver streams I/Q samples from one RTL-SDR and controls it.
service Receiver {
  // Device identity and capabilities.
  rpc Info(InfoRequest) returns (DeviceInfo);
  // Apply the fields that are set; return the effective state.
  rpc Configure(Settings) returns (Settings);
  // Sample stream. At most one active stream per remote; a new stream
  // takes over and the old one ends with ABORTED.
  rpc Stream(StreamRequest) returns (stream Frame);
}

message InfoRequest {}

message DeviceInfo {
  // Detected tuner chip.
  TunerType tuner = 1;
  // Board is an RTL-SDR Blog V4 (HF through upconverter).
  bool blog_v4 = 2;
  // Gain table in tenths of dB, ascending.
  repeated int32 gains_tenth_db = 3;
  // USB manufacturer string.
  string manufacturer = 4;
  // USB product string.
  string product = 5;
  // Current device state.
  Settings current = 6;
}

// Values match librtlsdr and the rtl_tcp greeting.
enum TunerType {
  TUNER_TYPE_UNKNOWN = 0;
  TUNER_TYPE_E4000 = 1;
  TUNER_TYPE_FC0012 = 2;
  TUNER_TYPE_FC0013 = 3;
  TUNER_TYPE_FC2580 = 4;
  TUNER_TYPE_R820T = 5;
  TUNER_TYPE_R828D = 6;
}

// Explicit presence: unset fields are left unchanged.
message Settings {
  // Center frequency in Hz.
  optional uint64 frequency_hz = 1;
  // Sample rate in Hz, as requested.
  optional uint32 sample_rate_hz = 2;
  // Sample rate actually achieved, in Hz. Reply only.
  optional double sample_rate_exact_hz = 3;
  // Crystal correction in ppm.
  optional sint32 ppm = 4;
  // Manual tuner gain instead of tuner AGC.
  optional bool gain_manual = 5;
  // Tuner gain in tenths of dB, one of DeviceInfo.gains_tenth_db.
  // Implies manual gain.
  optional sint32 gain_tenth_db = 6;
  // Demodulator digital AGC.
  optional bool agc = 7;
  // DC power on the antenna input.
  optional bool bias_tee = 8;
  // Direct sampling mode.
  optional DirectSampling direct_sampling = 9;
}

enum DirectSampling {
  DIRECT_SAMPLING_OFF = 0;
  DIRECT_SAMPLING_I = 1;
  DIRECT_SAMPLING_Q = 2;
}

message StreamRequest {
  // Lowest bits per component the remote may use, 1..8; 0 means 2.
  uint32 min_bits = 1;
  // Highest bits per component, 1..8; 0 means 8.
  uint32 max_bits = 2;
}

message Frame {
  // Index of the first complex sample since the stream started.
  uint64 first_sample = 1;
  // Complex samples in this frame.
  uint32 count = 2;
  // Bits per component, 1..8. At 8, data is raw u8 I/Q.
  uint32 bits = 3;
  // Quantizer step in u8 units, for bits < 8.
  float step = 4;
  // Incremented by every Configure that changed tuning.
  uint64 settings_gen = 5;
  // Packed codes, I and Q interleaved, MSB first.
  bytes data = 6;
  // When the remote read the frame from USB.
  int64 captured_unix_nano = 7;
}
